profiles:
  - id: "example-workflow"
    name: "Example workflow"
    description: "Fetch runtime artifacts that runtime analysis can join onto existing quality-map evidence paths."
    source_kind: "github-actions"

    source_refs:
      - path: ".github/workflows/publish.yml"
        label: "Workflow source"
      - path: ".quality-center/evidence/002-example-feature/quality-map.yaml"
        label: "Feature quality map"

    auth:
      required_env:
        - "GITHUB_TOKEN" # Only for github-actions sources

    github:
      repo: "org/repo"
      workflow: "publish.yml"
      artifact_names:
        - "qc-observations-*"
      # branch: "main" # Optional narrow filter

    # local_folder:
    #   path: "artifacts/qc"

    adapters:
      - id: "browser-junit"
        name: "Browser JUnit"
        type: "junit"
        artifact_path: "cli/browser-e2e.junit.xml"

      - id: "shared-sdk-junit"
        name: "Shared SDK JUnit"
        type: "junit"
        artifact_path: "engine-fixture.junit.xml"

      # Manifest adapter: for smoke/health checks and other gates that are not test
      # files. A workflow step writes a small JSON report of per-check status; each
      # record joins to a quality-map evidence entry by (test_file, test_case).
      # artifact_path is OPTIONAL — omit only when the artifact is dedicated to
      # observations (JSON-only); set it when the source also holds other JSON.
      # (See the authoring notes at the bottom for why.)
      - id: "release-smoke-manifest"
        name: "Release smoke checks"
        type: "manifest"
        # artifact_path: "observations/smoke-checks.json"  # optional; add if clear from the workflow

# Manifest contract (what the workflow writes as the JSON report):
#   [
#     { "test_file": ".github/workflows/release.yml",
#       "test_case": "agent_payload", "status": "pass" }
#   ]
#   - test_file: matches quality-map evidence.path (the workflow file for checks).
#   - test_case: matches evidence.test_case; omit for file-level proof. The same
#     path/test_case pinning semantics apply to every adapter.
#   - status: pass | fail | error | skipped (case-insensitive; passed/ok/failed accepted).
#   - Optional per-record: observed_at (ISO), note.
#   - The top-level may also be { "observations": [ ... ] }.
#
# Authoring notes:
# - One profile per source integration; profiles only declare where results come from.
# - artifact_path is optional for manifests, but choose deliberately:
#     * omit it only when the artifact is DEDICATED to observations (JSON-only,
#       e.g. a qc-* bundle) — every JSON file is then read as a manifest;
#     * set it when the source also holds other JSON (Playwright reports, release
#       records, etc.). The reader tries every .json; non-manifest JSON never
#       becomes a false observation, but it yields diagnostics and a "partial"
#       status. Pointing artifact_path at the one report avoids that noise.
# - Prefer existing structured artifacts (JUnit/Playwright) when the workflow
#   already produces them; use a manifest for checks that have no such report.
# - quality-map evidence.path is the canonical proof-source path (the workflow
#   file for checks); pinned checks disambiguate by test_case.
# - Derive github.repo from the repo's git remote rather than hardcoding it.
# - Keep artifact selection tight; do not fetch unrelated workflow noise.
