profiles:
  - id: "example-workflow"
    name: "Example workflow"
    description: "Fetch runtime artifacts that Quality Center can join onto existing quality-map evidence paths."
    source_kind: "github-actions" # github-actions | local-folder

    source_refs:
      - path: ".github/workflows/publish.yml"
        label: "Workflow source"
      - path: "quality-evidence/002-example-feature/quality-map.yaml"
        label: "Feature quality map"

    auth:
      required_env:
        - "GITHUB_TOKEN" # Only for github-actions sources

    github:
      repo: "org/repo"
      workflow: "publish.yml"
      artifact_names:
        - "qc-observations-*"
      # branch: "main" # Optional narrow filter

    # local_folder:
    #   path: "artifacts/qc"

    adapters:
      - id: "browser-junit"
        name: "Browser JUnit"
        type: "junit" # junit | playwright-json
        artifact_path: "cli/browser-e2e.junit.xml"

      - id: "shared-sdk-junit"
        name: "Shared SDK JUnit"
        type: "junit"
        artifact_path: "engine-fixture.junit.xml"

# Authoring notes:
# - One profile per source integration.
# - Profiles only declare where runtime results come from.
# - Prefer standard structured artifacts such as JUnit XML or Playwright JSON.
# - quality-map evidence.path is the canonical proof-source file path.
# - Quality Center joins observations to evidence by test file path; when a
#   report omits file path, it may fall back to test class basename.
# - Keep artifact selection tight; do not fetch unrelated workflow noise.
