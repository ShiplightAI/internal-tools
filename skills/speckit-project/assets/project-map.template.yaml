schema_version: 1

project:
  id: "<project-slug>"
  name: "<Project Name>"
  summary: "<Product-language project summary>"
  source_refs:
    - path: "README.md"
      label: "Project README"
    - path: "docs/prd.md"
      label: "Product requirements"
    - path: "docs/feature-breakdown.md"
      label: "Feature breakdown"

product_docs:
  - id: "prd"
    path: "docs/prd.md"
    role: "product_requirements"
    status: "current"
  - id: "feature-breakdown"
    path: "docs/feature-breakdown.md"
    role: "roadmap"
    status: "current"

roadmap:
  current_milestone: "MVP"
  release_areas:
    - id: "mvp"
      name: "Minimum viable product"
      description: "<Product capability, workflow, or outcome this release area covers>"
      feature_ids: []
      exit_criteria: []
  feature_order: []

active_feature:
  id: null
  branch: null
  spec_path: null
  phase: null
  updated_at: null

features:
  - id: "001-example-feature"
    name: "Example Feature"
    description: "<Product-language feature promise or workflow>"
    status: "candidate"
    priority: "P1"
    source_type: "INFERRED"
    dependencies: []
    implements_prd_refs:
      - path: "docs/prd.md"
        anchor: null
    artifacts:
      spec_path: "specs/001-example-feature/spec.md"
      plan_path: "specs/001-example-feature/plan.md"
      tasks_path: "specs/001-example-feature/tasks.md"
      checklist_paths: []
      quality_map_path: "quality-evidence/001-example-feature/quality-map.yaml"
      test_report_path: "quality-evidence/001-example-feature/test-report.md"
    code_refs: []
    evidence_refs: []
    open_questions: []
    residual_risks: []

cross_feature_concerns:
  - id: "example-concern"
    title: "Example concern"
    status: "open"
    feature_ids: []
    source_refs: []
    notes: "<Product-language concern summary>"

discovery:
  mode: "greenfield"
  last_scanned_at: null
  source_types:
    - "SOURCE"
    - "IMPLEMENTATION"
    - "INFERRED"
    - "LEGACY"
    - "DEPRECATED"
  orphan_code_refs: []
  specs_without_implementation: []
  implementation_without_specs: []
  tests_without_specs: []
  evidence_gaps: []
  unresolved_drift: []
