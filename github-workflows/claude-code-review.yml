name: Claude Code Review

# Copy this ~15-line file into a repo's .github/workflows/claude-code-review.yml.
# The trigger + permissions must live here (GitHub requires `on:` in the repo's
# own workflow, and claude-code-action's tamper guard wants this file on the
# repo's default branch). Everything else — prompt, approval logic, pinned refs —
# lives in the ShiplightAI/internal-tools/claude-review composite action.
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # submit the review (approve / request-changes / comment)
      issues: read
      id-token: write # required: claude-code-action mints its App token via OIDC
    steps:
      - uses: ShiplightAI/internal-tools/claude-review@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Optional per-repo emphasis, e.g.:
          # review-focus: |
          #   This is high-trust CI tooling that runs in consumers' privileged jobs;
          #   weight GitHub Actions injection, secret handling, and least privilege.
